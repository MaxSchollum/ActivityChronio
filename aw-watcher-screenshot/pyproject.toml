[tool.poetry]
name = "aw-watcher-screenshot"
version = "0.1.0"
description = "Local Chronio screenshot watcher for ActivityWatch"
authors = ["Chronio contributors"]
license = "MPL-2.0"

[tool.poetry.scripts]
aw-watcher-screenshot = "aw_watcher_screenshot:main"

[tool.poetry.dependencies]
python = "^3.8"
aw-client = "^0.5.14"

[tool.poetry.group.dev.dependencies]
pytest = "*"
mypy = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
